name: CloseOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: closeos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test_openai_key_stub_ci
      VERIFY_MESSAGING_ENV_CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test suite
        run: npm run test:ci

      - name: CloseOS production QA
        run: npm run verify:closeos-qa -- --ci
        env:
          VERIFY_CLOSEOS_QA_CI: "1"

      - name: Verify messaging env script
        run: npm run verify:messaging-env
